# Test data for seedURI S3 credentials mounting
neo4j:
  name: "seeduri-test"
  edition: "enterprise"
  acceptLicenseAgreement: "eval"

volumes:
  data:
    mode: "defaultStorageClass"

secretMounts:
  s3-credentials:
    secretName: "cloud-s3-credentials"
    mountPath: "/var/secrets/s3"
    items:
      - key: "access-key-id"
        path: "access-key"
      - key: "secret-access-key"
        path: "secret-key"
      - key: "endpoint"
        path: "endpoint"
      - key: "region"
        path: "region"
    defaultMode: 0600
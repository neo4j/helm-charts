# Test data with invalid secretMounts configuration
secretMounts:
  # Missing secretName (should fail validation)
  missing-secret-name:
    mountPath: "/var/secrets/s3"
  
  # Missing mountPath (should fail validation)
  missing-mount-path:
    secretName: "my-secret"
  
  # Invalid items configuration (missing key)
  invalid-items:
    secretName: "my-secret"
    mountPath: "/var/secrets/test"
    items:
      - path: "test-file"  # Missing key field
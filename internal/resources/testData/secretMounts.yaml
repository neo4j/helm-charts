secretMounts:
  s3-credentials:
    secretName: "my-s3-secret"
    mountPath: "/var/secrets/s3"
    items:
      - key: "access-key"
        path: "access-key"
      - key: "secret-key"
        path: "secret-key"
    defaultMode: 0600
  
  tls-certificates:
    secretName: "my-tls-certs"
    mountPath: "/var/secrets/tls"
name: Execute Tests

on:
  workflow_dispatch:
    inputs:
      HELM_CHART_VERSION:
        description: 'Helm chart version to be released (e.g., 5.26.26)'
        type: string
      DOCKER_IMAGE_VERSION:
        description: 'Docker image version/Neo4j version to use (e.g., 5.26.26)'
        type: string
      RELEASE:
        description: 'Release (True) or execute only tests (False)'
        type: boolean
        default: false
  pull_request:
    paths-ignore:
      - build/*
    branches:
      - 5.26

env:
  GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
  CLOUDSDK_COMPUTE_ZONE: "europe-west2-b"
  CLOUDSDK_COMPUTE_REGION: "europe-west2"
  GO_TEST_COUNT: 1
  GO_TEST_TIMEOUT: 45m
  GO_TEST_FORMAT: json
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
  GCP_SERVICE_ACCOUNT_CRED: ${{ secrets.GCLOUD_SERVICE_KEY }}
  BLOOM_LICENSE: ${{ secrets.BLOOM_LICENSE }}
  IPS_USERNAME: ${{ secrets.IPS_USERNAME }}
  IPS_EMAIL: ${{ secrets.IPS_EMAIL }}

  RESOURCE_PREFIX: ghactions

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: gate
        uses: ./.github/actions/authz-gate
        with:
          allowed_actors: ${{ vars.CI_ALLOWED_ACTORS }}

  check-release:
    needs: check-pr
    if: inputs.RELEASE
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: gate
        uses: ./.github/actions/authz-gate
        with:
          allowed_actors: ${{ vars.CI_ALLOWED_ACTORS }}
          require_dispatch: 'true'
          require_branch: '5.26'

  cleanup:
    needs: check-pr
    if: needs.check-pr.outputs.should_run == 'true'
    name: Cleanup Dangling Resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Authenticate Service Account
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'
          
      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: '>= 363.0.0'
          
      - name: Run Cleanup
        run: ./bin/gcloud/cleanup_resources

  gke-setup:
    name: Debian GKE Creation
    needs: [cleanup, check-pr]
    if: needs.check-pr.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate Service Account
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: Create GKE Cluster
        run: |
          export CLOUDSDK_CONTAINER_CLUSTER=${RESOURCE_PREFIX}-${RUN_ID}
          ./bin/gcloud/create_cluster
    outputs:
      CLOUDSDK_CONTAINER_CLUSTER: "${{ env.RESOURCE_PREFIX }}-${{ env.RUN_ID }}"

  gke-setup-redhat:
    name: RedHat GKE Creation
    needs: [cleanup, check-pr]
    if: needs.check-pr.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Authenticate Service Account
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: Create GKE Cluster
        run: |
          export CLOUDSDK_CONTAINER_CLUSTER=${RESOURCE_PREFIX}-redhat-${RUN_ID}
          ./bin/gcloud/create_cluster
    outputs:
      CLOUDSDK_CONTAINER_CLUSTER_REDHAT: "${{ env.RESOURCE_PREFIX }}-redhat-${{ env.RUN_ID }}"

  build-reverseproxy-backup:
    name: ReverseProxy and Backup Docker Image build
    needs: [cleanup, check-pr]
    if: needs.check-pr.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build & push test images
        uses: ./.github/actions/build-neo4j-images
        with:
          registry: europe-west2-docker.pkg.dev
          registry_username: _json_key
          registry_password: ${{ secrets.GCLOUD_SERVICE_KEY }}
          reverseproxy_tag: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/reverseproxy:${{ env.RUN_ID }}
          operations_tag: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-operations:${{ env.RUN_ID }}
          backup_tag_debian: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:${{ env.RUN_ID }}
          backup_tag_redhat: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:ubi10-${{ env.RUN_ID }}
          backup_source_debian: ${{ inputs.RELEASE && format('neo4j:{0}-enterprise', inputs.DOCKER_IMAGE_VERSION) || format('{0}/neo4j:5-enterprise-debian-nightly-bundle', vars.ARTIFACT_REGISTRY_REPO_NAME) }}
          backup_source_redhat: ${{ inputs.RELEASE && format('neo4j:{0}-enterprise-ubi10', inputs.DOCKER_IMAGE_VERSION) || format('{0}/neo4j:5-enterprise-redhat-nightly-bundle', vars.ARTIFACT_REGISTRY_REPO_NAME) }}
          dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  run-tests-debian:
    name: Debian tests
    needs: [gke-setup, build-reverseproxy-backup, check-pr]
    if: needs.check-pr.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        edition: [enterprise, community]
    uses: ./.github/workflows/run-integration-tests.yml
    with:
      edition: ${{ matrix.edition }}
      os: debian
      release: ${{ inputs.RELEASE && 'true' || 'false' }}
      docker_image_version: ${{ inputs.DOCKER_IMAGE_VERSION }}
      cluster_name: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
    secrets: inherit

  run-tests-redhat:
    name: RedHat tests
    needs: [gke-setup-redhat, build-reverseproxy-backup, check-pr]
    if: needs.check-pr.outputs.should_run == 'true'
    strategy:
      fail-fast: false
      matrix:
        edition: [enterprise, community]
    uses: ./.github/workflows/run-integration-tests.yml
    with:
      edition: ${{ matrix.edition }}
      os: redhat
      release: ${{ inputs.RELEASE && 'true' || 'false' }}
      docker_image_version: ${{ inputs.DOCKER_IMAGE_VERSION }}
      cluster_name: ${{ needs.gke-setup-redhat.outputs.CLOUDSDK_CONTAINER_CLUSTER_REDHAT }}
    secrets: inherit

  gke-delete:
    name: Debian GKE Cluster Deletion
    runs-on: ubuntu-latest
    if: always() && needs.check-pr.outputs.should_run == 'true'
    env:
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
    needs:
      - check-pr
      - gke-setup
      - run-tests-debian
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: 'gcloud-auth'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: '>= 363.0.0'

      - name: Delete GKE Cluster
        run: |
          ./bin/gcloud/delete_cluster

  gke-delete-redhat:
    name: RedHat GKE Cluster Deletion
    runs-on: ubuntu-latest
    if: always() && needs.check-pr.outputs.should_run == 'true'
    env:
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup-redhat.outputs.CLOUDSDK_CONTAINER_CLUSTER_REDHAT }}
    needs:
      - check-pr
      - gke-setup-redhat
      - run-tests-redhat
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - id: 'gcloud-auth'
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
        with:
          version: '>= 363.0.0'

      - name: Delete GKE Cluster
        run: |
          ./bin/gcloud/delete_cluster

  build-reverseproxy-backup-release-image:
    name: ReverseProxy and Backup Docker Image build
    needs: [run-tests-debian, run-tests-redhat, check-release]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should_run == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build & push release images
        uses: ./.github/actions/build-neo4j-images
        with:
          registry: docker.io
          registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          reverseproxy_tag: neo4j/helm-charts-reverse-proxy:${{ inputs.DOCKER_IMAGE_VERSION }}
          operations_tag: neo4j/helm-charts-operations:${{ inputs.DOCKER_IMAGE_VERSION }}
          backup_tag_debian: neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}
          backup_tag_redhat: neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}-ubi10
          backup_source_debian: neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise
          backup_source_redhat: neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise-ubi10
          cache_scope: release

  packaging:
    name: Packaging and Release
    needs: [run-tests-debian, run-tests-redhat, build-reverseproxy-backup-release-image, check-release]
    runs-on: ubuntu-latest
    if: needs.check-release.outputs.should_run == 'true'
    env:
      HELM_CHART_VERSION: ${{ inputs.HELM_CHART_VERSION }}
      DOCKER_IMAGE_VERSION: ${{ inputs.DOCKER_IMAGE_VERSION }}
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:${{ vars.CI_IMAGE_TAG || 'latest' }}
      options: --user 1001
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: '0'
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}
          ref: 5.26

      - name: Version Updates
        run: |
          git config --global user.email team-smcs@neo4j.com
          git config --global user.name "team-smcs"
          ./bin/gcloud/version_updates

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p tmp
          python3 bin/changelog/generate.py \
            --chart-version "${HELM_CHART_VERSION}" \
            --docker-version "${DOCKER_IMAGE_VERSION}" \
            --out tmp/release-notes.md
          python3 bin/changelog/update_file.py \
            --notes tmp/release-notes.md \
            --changelog CHANGELOG.md \
            --chart-version "${HELM_CHART_VERSION}" \
            --docker-version "${DOCKER_IMAGE_VERSION}"
          git add CHANGELOG.md

      - name: GPG Key Signing
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_GPG }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_GPG }}
          export ROLE_ARN_GPG=${{ secrets.ROLE_ARN_GPG }}
          export SECRET_ID_GPG=${{ secrets.SECRET_ID_GPG }}          
          ./bin/gcloud/gpg_signing          

      - name: Upload Helm Charts
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_HELM }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_HELM }}
          export AWS_REGION="us-east-1"          
          export PACKAGE_SIGNING_KEY=${{ secrets.PACKAGE_SIGNING_KEY }}
          export PACKAGE_SIGNING_PASSPHRASE=${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          ./bin/gcloud/package_upload          

      - name: Update index.yaml
        run: |          
          ./bin/gcloud/index_yaml_update

      - name: Set Chart Version
        id: chart_version
        run: |
          echo "CHART_VERSION=${HELM_CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Using chart version ${HELM_CHART_VERSION} for release"

      - name: Release Notes
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          name: v${{ steps.chart_version.outputs.CHART_VERSION }}
          tag_name: ${{ steps.chart_version.outputs.CHART_VERSION }}
          token: ${{ secrets.GH_TOKEN }}
          body_path: tmp/release-notes.md
          make_latest: true
          files: |
            tmp/new-packages/*.tgz

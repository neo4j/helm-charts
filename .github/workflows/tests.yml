          push: true
          tags: "neo4j/helm-charts-backup:${{ inputs.NEO4J_VERSION }}-ubi9"
          provenance: false
          build-args: |
            IMAGE=neo4j:${{ inputs.NEO4J_VERSION }}-enterprise-ubi9
            DISTRIBUTION=redhat

  build-reverseproxy-backup-release-image-after-tests:
    name: Build and Push Docker Images Prod (after tests)
    needs: [check-pr, run-community-tests, run-community-tests-redhat, run-enterprise-tests, run-enterprise-tests-redhat]
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      needs.check-pr.outputs.should_run == 'true' && 
      needs.check-pr.outputs.is_pull_request == 'false' &&
      github.ref_name == 'dev' && 
      github.event_name == 'workflow_dispatch' && 
      (github.actor == 'bfeshti') && 
      github.event.inputs.WORKFLOW_MODE == 'full_pipeline' && 
      needs.run-community-tests.result == 'success' && 
      needs.run-community-tests-redhat.result == 'success' && 
      needs.run-enterprise-tests.result == 'success' && 
      needs.run-enterprise-tests-redhat.result == 'success'
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push reverse proxy image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-reverse-proxy"
          push: true
          tags: "neo4j/helm-charts-reverse-proxy:${{ inputs.NEO4J_VERSION }}"
          provenance: false

      - name: Build and push operations image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j/neo4j-operations"
          push: true
          tags: "neo4j/helm-charts-operations:${{ inputs.NEO4J_VERSION }}"
          provenance: false

      - name: Build and push backup image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: true
          tags: "neo4j/helm-charts-backup:${{ inputs.NEO4J_VERSION }}"
          provenance: false
          build-args: |
            IMAGE=neo4j:${{ inputs.NEO4J_VERSION }}-enterprise
            DISTRIBUTION=debian

      - name: Build and push red hat backup image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: true
          tags: "neo4j/helm-charts-backup:${{ inputs.NEO4J_VERSION }}-ubi9"
          provenance: false
          build-args: |
            IMAGE=neo4j:${{ inputs.NEO4J_VERSION }}-enterprise-ubi9
            DISTRIBUTION=redhat

  packaging:
    name: Packaging and Release
    needs: [check-pr, build-reverseproxy-backup-release-image, build-reverseproxy-backup-release-image-after-tests]
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      needs.check-pr.outputs.should_run == 'true' && 
      needs.check-pr.outputs.is_pull_request == 'false' &&
      github.ref_name == 'dev' && 
      github.event_name == 'workflow_dispatch' && 
      github.actor == 'bfeshti' && 
      (
        github.event.inputs.WORKFLOW_MODE == 'full_pipeline' ||
        github.event.inputs.WORKFLOW_MODE == 'package_release_only'
      )
    env:
      NEO4J_VERSION: ${{ inputs.NEO4J_VERSION }}
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
      options: --user 1001
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}
          ref: dev

      - name: Determine Version Type
        id: version_type
        run: |
          if [[ "${{ inputs.NEO4J_VERSION }}" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
            echo "is_calver=true" >> $GITHUB_OUTPUT
            echo "version_type=calver" >> $GITHUB_OUTPUT
            
            # Extract year and month from calver format (YYYY.MM.DD)
            year=$(echo "${{ inputs.NEO4J_VERSION }}" | cut -d. -f1)
            month=$(echo "${{ inputs.NEO4J_VERSION }}" | cut -d. -f2)
            
            # Format the release notes URL with hyphens (YYYY-MM)
            echo "release_notes_url=https://neo4j.com/release-notes/database/neo4j-${year}-${month}/" >> $GITHUB_OUTPUT
          else
            echo "is_calver=false" >> $GITHUB_OUTPUT
            echo "version_type=semver" >> $GITHUB_OUTPUT
            echo "release_notes_url=https://neo4j.com/release-notes/database/neo4j-5/" >> $GITHUB_OUTPUT
          fi

      - name: Version Updates
        run: |          
          git config --global user.email team-smcs@neo4j.com
          git config --global user.name "team-smcs"
          ./bin/gcloud/version_updates

      - name: GPG Key Signing
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_GPG }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_GPG }}
          export ROLE_ARN_GPG=${{ secrets.ROLE_ARN_GPG }}
          export SECRET_ID_GPG=${{ secrets.SECRET_ID_GPG }}          
          ./bin/gcloud/gpg_signing          

      - name: Upload Helm Charts
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_HELM }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_HELM }}
          export AWS_REGION="us-east-1"          
          export PACKAGE_SIGNING_KEY=${{ secrets.PACKAGE_SIGNING_KEY }}
          export PACKAGE_SIGNING_PASSPHRASE=${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          ./bin/gcloud/package_upload          

      - name: Update index.yaml
        run: |          
          ./bin/gcloud/index_yaml_update

      - name: Release Notes
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ inputs.NEO4J_VERSION }}
          tag_name: ${{ inputs.NEO4J_VERSION }}
          token: ${{ secrets.GH_TOKEN }}
          body: "- Update to Neo4j ${{ inputs.NEO4J_VERSION }} as the new baseline, see [Release notes](${{ steps.version_type.outputs.release_notes_url }}) for details of changes"
          make_latest: true
          files: |
            neo4j-${{ inputs.NEO4J_VERSION }}.tgz
            neo4j-admin-${{ inputs.NEO4J_VERSION }}.tgz
            neo4j-reverse-proxy-${{ inputs.NEO4J_VERSION }}.tgz
            neo4j-headless-service-${{ inputs.NEO4J_VERSION }}.tgz
            neo4j-persistent-volume-${{ inputs.NEO4J_VERSION }}.tgz
            neo4j-loadbalancer-${{ inputs.NEO4J_VERSION }}.tgz

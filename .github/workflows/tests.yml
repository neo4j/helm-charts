name: Test and Release pipeline

on:
  workflow_dispatch:
    inputs:
      NEO4J_VERSION:
        description: 'Neo4j version to be released'
        type: string
      WORKFLOW_MODE:
        description: 'Select which parts of the workflow to run'
        type: choice
        options:
          - tests_only          
          - full_pipeline
          - docker_images_only
          - package_release_only
        default: 'tests_only'
        required: true
  pull_request:
    paths-ignore:
      - build/*
    branches:
      - dev

env:
  GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
  CLOUDSDK_COMPUTE_ZONE: "europe-west2-b"
  CLOUDSDK_COMPUTE_REGION: "europe-west2"
  GO_TEST_COUNT: 1
  GO_TEST_TIMEOUT: 35m
  GO_TEST_FORMAT: json
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
  GCP_SERVICE_ACCOUNT_CRED: ${{ secrets.GCLOUD_SERVICE_KEY }}
  BLOOM_LICENSE: ${{ secrets.BLOOM_LICENSE }}
  IPS_USERNAME: ${{ secrets.IPS_USERNAME }}
  IPS_EMAIL: ${{ secrets.IPS_EMAIL }}

  RESOURCE_PREFIX: ghactions

permissions:
  pull-requests: read

jobs:
  check-pr:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      is_pull_request: ${{ steps.check.outputs.is_pull_request }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.actor }}" == "bfeshti" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_pull_request=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" && "${{ github.actor }}" == "bfeshti" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "is_pull_request=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "is_pull_request=false" >> $GITHUB_OUTPUT
          fi

  cleanup:
    needs: check-pr
    if: needs.check-pr.outputs.should_run == 'true'
    name: Cleanup Dangling Resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Authenticate Service Account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'
          
      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'
          
      - name: Run Cleanup
        run: ./bin/gcloud/cleanup_resources

  gke-setup:
    name: Debian GKE Creation
    needs: [cleanup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Service Account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: Create GKE Cluster
        run: |
          export CLOUDSDK_CONTAINER_CLUSTER=${RESOURCE_PREFIX}-${RUN_ID}
          ./bin/gcloud/create_cluster
    outputs:
      CLOUDSDK_CONTAINER_CLUSTER: "${{ env.RESOURCE_PREFIX }}-${{ env.RUN_ID }}"

  gke-setup-redhat:
    name: RedHat GKE Creation
    needs: [cleanup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate Service Account
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: Create GKE Cluster
        run: |
          export CLOUDSDK_CONTAINER_CLUSTER=${RESOURCE_PREFIX}-redhat-${RUN_ID}
          ./bin/gcloud/create_cluster
    outputs:
      CLOUDSDK_CONTAINER_CLUSTER_REDHAT: "${{ env.RESOURCE_PREFIX }}-redhat-${{ env.RUN_ID }}"

  build-reverseproxy-backup:
    name: Build and Push Docker Images Dev
    needs: [cleanup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only' || github.event.inputs.WORKFLOW_MODE == 'docker_images_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: europe-west2-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Build and push reverse proxy image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-reverse-proxy"
          push: true
          tags: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/reverseproxy:${{ env.RUN_ID }}"
          provenance: false

      - name: Build and push neo4j operations image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j/neo4j-operations"
          push: true
          tags: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-operations:${{ env.RUN_ID }}"
          provenance: false

      - name: Build and push backup image for tests
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: true
          tags: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:${{ env.RUN_ID }}"
          provenance: false
          build-args: |
            IMAGE=${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j:enterprise-dev
            DISTRIBUTION=debian

      - name: Build and push red hat backup image for tests
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: true
          tags: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:ubi9-${{ env.RUN_ID }}"
          provenance: false
          build-args: |
            IMAGE=${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j:enterprise-dev-ubi9
            DISTRIBUTION=redhat

  run-enterprise-tests:
    name: Debian Enterprise tests
    needs: [gke-setup, build-reverseproxy-backup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NEO4J_EDITION: "enterprise"
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
      NEO4J_DOCKER_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j:enterprise-dev"
      NEO4J_REVERSE_PROXY_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/reverseproxy:${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_DOCKER_BACKUP_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_OPERATIONS_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-operations:${{ github.run_id }}-${{ github.run_attempt }}"
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'gcloud-auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
          location: ${{ env.CLOUDSDK_COMPUTE_ZONE }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

      - name: Run Enterprise Integration and Unit tests
        run: |
          mkdir -p .kube
          cat ${KUBECONFIG} > .kube/config
          CURRENT_DIRECTORY=$(pwd)
          export KUBECONFIG="${CURRENT_DIRECTORY}/.kube/config"
          echo "printing kubeconfig path $KUBECONFIG"
          export IPS_PASS=$(gcloud auth print-access-token)
          # Check if NEO4J_VERSION is provided and we're in release mode
          if [[ -n "${{ inputs.NEO4J_VERSION }}" && "${{ github.event.inputs.WORKFLOW_MODE }}" == "full_pipeline" ]]; then
            export NEO4J_DOCKER_IMG="neo4j:${{ inputs.NEO4J_VERSION }}-enterprise"
          fi
          echo "NEO4J_DOCKER_IMG=${NEO4J_DOCKER_IMG}"
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/integration_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/unit_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt

  run-community-tests:
    name: Debian Community Tests
    needs: [gke-setup, build-reverseproxy-backup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NEO4J_EDITION: "community"
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
      NEO4J_DOCKER_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j:community-dev"
      NEO4J_REVERSE_PROXY_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/reverseproxy:${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_DOCKER_BACKUP_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_OPERATIONS_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-operations:${{ github.run_id }}-${{ github.run_attempt }}"
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'gcloud-auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
          location: ${{ env.CLOUDSDK_COMPUTE_ZONE }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

      - name: Run Community Integration and Unit tests
        run: |
          mkdir -p .kube
          cat ${KUBECONFIG} > .kube/config
          CURRENT_DIRECTORY=$(pwd)
          export KUBECONFIG="${CURRENT_DIRECTORY}/.kube/config"
          echo "printing kubeconfig path $KUBECONFIG"
          export IPS_PASS=$(gcloud auth print-access-token)
          # Check if NEO4J_VERSION is provided and we're in release mode
          if [[ -n "${{ inputs.NEO4J_VERSION }}" && "${{ github.event.inputs.WORKFLOW_MODE }}" == "full_pipeline" ]]; then
            export NEO4J_DOCKER_IMG="neo4j:${{ inputs.NEO4J_VERSION }}"
          fi
          echo "NEO4J_DOCKER_IMG=${NEO4J_DOCKER_IMG}"
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/integration_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/unit_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt

  run-enterprise-tests-redhat:
    name: RedHat Enterprise Tests
    needs: [gke-setup-redhat, build-reverseproxy-backup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NEO4J_EDITION: "enterprise"
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup-redhat.outputs.CLOUDSDK_CONTAINER_CLUSTER_REDHAT }}
      NEO4J_DOCKER_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j:enterprise-dev-ubi9"
      NEO4J_REVERSE_PROXY_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/reverseproxy:${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_DOCKER_BACKUP_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:ubi9-${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_OPERATIONS_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-operations:${{ github.run_id }}-${{ github.run_attempt }}"
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'gcloud-auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ env.CLOUDSDK_CONTAINER_CLUSTER }}
          location: ${{ env.CLOUDSDK_COMPUTE_ZONE }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

      - name: Run Enterprise Integration and Unit tests for Red Hat
        run: |
          mkdir -p .kube
          cat ${KUBECONFIG} > .kube/config
          CURRENT_DIRECTORY=$(pwd)
          export KUBECONFIG="${CURRENT_DIRECTORY}/.kube/config"
          echo "printing kubeconfig path $KUBECONFIG"
          export IPS_PASS=$(gcloud auth print-access-token)
          # Check if NEO4J_VERSION is provided and we're in release mode
          if [[ -n "${{ inputs.NEO4J_VERSION }}" && "${{ github.event.inputs.WORKFLOW_MODE }}" == "full_pipeline" ]]; then
            export NEO4J_DOCKER_IMG="neo4j:${{ inputs.NEO4J_VERSION }}-enterprise-ubi9"
          fi
          echo "NEO4J_DOCKER_IMG=${NEO4J_DOCKER_IMG}"
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/integration_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/unit_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt

  run-community-tests-redhat:
    name: RedHat Community Tests
    needs: [gke-setup-redhat, build-reverseproxy-backup, check-pr]
    if: >
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    runs-on: ubuntu-latest
    env:
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      NEO4J_EDITION: "community"
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup-redhat.outputs.CLOUDSDK_CONTAINER_CLUSTER_REDHAT }}
      NEO4J_DOCKER_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j:community-dev-ubi9"
      NEO4J_REVERSE_PROXY_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/reverseproxy:${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_DOCKER_BACKUP_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-admin:ubi9-${{ github.run_id }}-${{ github.run_attempt }}"
      NEO4J_OPERATIONS_IMG: "${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/neo4j-operations:${{ github.run_id }}-${{ github.run_attempt }}"
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'gcloud-auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - id: 'get-credentials'
        uses: 'google-github-actions/get-gke-credentials@v2'
        with:
          cluster_name: ${{ env.CLOUDSDK_CONTAINER_CLUSTER }}
          location: ${{ env.CLOUDSDK_COMPUTE_ZONE }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Set up gotestfmt
        run: go install github.com/gotesttools/gotestfmt/v2/cmd/gotestfmt@latest

      - name: Run Community Integration and Unit tests for Red Hat
        run: |
          mkdir -p .kube
          cat ${KUBECONFIG} > .kube/config
          CURRENT_DIRECTORY=$(pwd)
          export KUBECONFIG="${CURRENT_DIRECTORY}/.kube/config"
          echo "printing kubeconfig path $KUBECONFIG"
          export IPS_PASS=$(gcloud auth print-access-token)
          # Check if NEO4J_VERSION is provided and we're in release mode
          if [[ -n "${{ inputs.NEO4J_VERSION }}" && "${{ github.event.inputs.WORKFLOW_MODE }}" == "full_pipeline" ]]; then
            export NEO4J_DOCKER_IMG="neo4j:${{ inputs.NEO4J_VERSION }}-ubi9"
          fi
          echo "NEO4J_DOCKER_IMG=${NEO4J_DOCKER_IMG}"
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/integration_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt
          go test -json -v -timeout ${GO_TEST_TIMEOUT} ./internal/unit_tests/ 2>&1 | tee /tmp/gotest.log | gotestfmt

  gke-delete:
    name: Debian GKE Cluster Deletion
    runs-on: ubuntu-latest
    if: >
      always() && 
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    env:
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup.outputs.CLOUDSDK_CONTAINER_CLUSTER }}
    needs:
      - run-enterprise-tests
      - run-community-tests
      - gke-setup
      - check-pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'gcloud-auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Delete GKE Cluster
        run: |
          ./bin/gcloud/delete_cluster

  gke-delete-redhat:
    name: RedHat GKE Cluster Deletion
    runs-on: ubuntu-latest
    if: >
      always() && 
      needs.check-pr.outputs.should_run == 'true' && 
      (
        (needs.check-pr.outputs.is_pull_request == 'true') || 
        (needs.check-pr.outputs.is_pull_request == 'false' && (github.event.inputs.WORKFLOW_MODE == 'full_pipeline' || github.event.inputs.WORKFLOW_MODE == 'tests_only'))
      )
    env:
      CLOUDSDK_CONTAINER_CLUSTER: ${{ needs.gke-setup-redhat.outputs.CLOUDSDK_CONTAINER_CLUSTER_REDHAT }}
    needs:
      - run-enterprise-tests-redhat
      - run-community-tests-redhat
      - gke-setup-redhat
      - check-pr
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - id: 'gcloud-auth'
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCLOUD_SERVICE_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          version: '>= 363.0.0'

      - name: Delete GKE Cluster
        run: |
          ./bin/gcloud/delete_cluster

  build-reverseproxy-backup-release-image:
    name: Build and Push Docker Images Prod
    needs: [check-pr]
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'pull_request' &&
      needs.check-pr.outputs.should_run == 'true' && 
      needs.check-pr.outputs.is_pull_request == 'false' &&
      github.ref_name == 'dev' && 
      github.event_name == 'workflow_dispatch' && 
      (github.actor == 'bfeshti') && 
      (github.event.inputs.WORKFLOW_MODE == 'docker_images_only' || github.event.inputs.WORKFLOW_MODE == 'package_release_only')
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push reverse proxy image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-reverse-proxy"
          push: true

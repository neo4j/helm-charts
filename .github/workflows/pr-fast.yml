name: PR fast suite

# Sub-5-minute PR signal: helm unit tests + helm lint + a kind-based install
# smoke test on the main neo4j chart. Exists so reviewers stop waiting 75
# minutes on every chart change. The full GKE-backed suite in tests.yml
# remains authoritative for cloud-dependent behavior (LoadBalancer IPs,
# workload identity, PD disks, etc.).
#
# See docs/ci/adr/0001-runner-topology.md for the rationale.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm lint + chart-testing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.14.3

      - name: helm lint (all charts)
        run: |
          set -e
          for chart in neo4j neo4j-admin neo4j-headless-service neo4j-loadbalancer \
                       neo4j-persistent-volume neo4j-reverse-proxy neo4j-docker-desktop-pv; do
            [[ -d "$chart" ]] || continue
            echo "::group::helm lint $chart"
            helm lint "$chart"
            echo "::endgroup::"
          done

      - name: Set up chart-testing
        uses: helm/chart-testing-action@e6669bcd63d7cb57cb4380c33043eebe5d111992 # v2.6.1

      - name: ct lint on changed charts
        run: |
          ct lint \
            --target-branch=dev \
            --chart-dirs . \
            --chart-yaml-schema=""   \
            --validate-maintainers=false

  testutil-unit:
    # Exercises the new utility packages (poll, testid, timeouts) that are
    # independent of the cluster-config package init and safe under -race.
    # internal/unit_tests is intentionally NOT included here: that package
    # mixes helm-template rendering (unit-like) with tests that perform real
    # `helm install` calls against a cluster and with tests that share
    # mutable state under `forEachSupportedEdition` which trips -race. The
    # full GKE pipeline exercises those; fixing them in-place is out of
    # scope for the overhaul.
    name: testutil package tests (-race)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go build ./...
        # Catches compile-level breakage anywhere in the repo before the
        # slow GKE pipeline even starts.
        run: go build ./...

      - name: Run testutil tests with race detector
        run: go test -race -count=1 ./internal/testutil/...

  kind-smoke:
    name: kind install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Create kind cluster
        uses: helm/kind-action@0b5c88445f37b7e12a2ce1ecca7805b9046a74db # v1
        with:
          version: v0.23.0
          cluster_name: pr-fast
          wait: 60s

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v3.14.3

      - name: helm template sanity check
        run: |
          # Confirm the main chart renders without errors under a minimal community config.
          helm template my-release neo4j \
            --set neo4j.name=my-neo4j \
            --set neo4j.edition=community \
            --set neo4j.acceptLicenseAgreement=yes \
            --set volumes.data.mode=defaultStorageClass \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) manifests"

      - name: kubectl apply --dry-run=server
        run: |
          # Dry-run against the real API server catches schema errors that
          # `helm template` alone cannot detect.
          kubectl apply --dry-run=server -f /tmp/rendered.yaml

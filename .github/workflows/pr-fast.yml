name: PR fast suite

# Sub-5-minute PR signal: helm unit tests + helm lint + a kind-based install
# smoke test on the main neo4j chart. Exists so reviewers stop waiting 75
# minutes on every chart change. The full GKE-backed suite in tests.yml
# remains authoritative for cloud-dependent behavior (LoadBalancer IPs,
# workload identity, PD disks, etc.).
#
# See docs/ci/adr/0001-runner-topology.md for the rationale.

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm-lint:
    name: helm lint + chart-testing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: helm lint (all charts)
        run: |
          set -e
          for chart in neo4j neo4j-admin neo4j-headless-service neo4j-loadbalancer \
                       neo4j-persistent-volume neo4j-reverse-proxy neo4j-docker-desktop-pv; do
            [[ -d "$chart" ]] || continue
            echo "::group::helm lint $chart"
            helm lint "$chart"
            echo "::endgroup::"
          done

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: ct lint on changed charts
        run: |
          ct lint \
            --target-branch=dev \
            --chart-dirs . \
            --chart-yaml-schema=""   \
            --validate-maintainers=false

  helm-unit:
    name: helm template unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: Run unit tests
        env:
          # internal/model/default_values.go demands these at package init;
          # provide stub values so the tests can import the model package.
          KUBECONFIG: /tmp/kubeconfig-empty
          NEO4J_EDITION: enterprise
          NEO4J_DOCKER_IMG: 'stub:stub'
          NEO4J_DOCKER_BACKUP_IMG: 'stub:stub'
          NEO4J_REVERSE_PROXY_IMG: 'stub:stub'
          NEO4J_OPERATIONS_IMG: 'stub:stub'
          BLOOM_LICENSE: stub
          IPS_USERNAME: stub
          IPS_PASS: stub
          IPS_EMAIL: stub
          AWS_ACCESS_KEY_ID: stub
          AWS_SECRET_ACCESS_KEY: stub
          AZURE_STORAGE_ACCOUNT: stub
          AZURE_STORAGE_KEY: stub
          AZURE_CLIENT_ID: stub
          AZURE_CLIENT_SECRET: stub
          AZURE_TENANT_ID: stub
          GCP_SERVICE_ACCOUNT_CRED: stub
        run: |
          mkdir -p /tmp
          cat > /tmp/kubeconfig-empty <<'EOF'
          apiVersion: v1
          kind: Config
          clusters: []
          contexts: []
          users: []
          EOF
          go test -race -count=1 ./internal/testutil/... ./internal/unit_tests/...

  kind-smoke:
    name: kind install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.23.0
          cluster_name: pr-fast
          wait: 60s

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.3

      - name: helm template sanity check
        run: |
          # Confirm the main chart renders without errors under a minimal community config.
          helm template my-release neo4j \
            --set neo4j.name=my-neo4j \
            --set neo4j.edition=community \
            --set neo4j.acceptLicenseAgreement=yes \
            --set volumes.data.mode=defaultStorageClass \
            > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml
          echo "Rendered $(grep -c '^kind:' /tmp/rendered.yaml) manifests"

      - name: kubectl apply --dry-run=server
        run: |
          # Dry-run against the real API server catches schema errors that
          # `helm template` alone cannot detect.
          kubectl apply --dry-run=server -f /tmp/rendered.yaml

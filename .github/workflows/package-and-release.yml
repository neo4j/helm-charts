name: Package and Release Only

on:
  workflow_dispatch:
    inputs:
      HELM_CHART_VERSION:
        description: 'Helm chart version to be released (e.g., 2025.4.0)'
        type: string
        required: true
      DOCKER_IMAGE_VERSION:
        description: 'Docker image version/Neo4j version to use (e.g., 2025.04.0)'
        type: string
        required: true

env:
  GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
  CLOUDSDK_COMPUTE_ZONE: "europe-west2-b"
  CLOUDSDK_COMPUTE_REGION: "europe-west2"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_STORAGE_ACCOUNT: ${{ secrets.AZURE_STORAGE_ACCOUNT }}
  AZURE_STORAGE_KEY: ${{ secrets.AZURE_STORAGE_KEY }}
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  GCP_SERVICE_ACCOUNT_CRED: ${{ secrets.GCLOUD_SERVICE_KEY }}
  BLOOM_LICENSE: ${{ secrets.BLOOM_LICENSE }}
  IPS_USERNAME: ${{ secrets.IPS_USERNAME }}
  IPS_EMAIL: ${{ secrets.IPS_EMAIL }}
  RESOURCE_PREFIX: ghactions

permissions:
  contents: write

jobs:
  check-authorization:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        uses: ./.github/actions/authz-gate
        with:
          allowed_actors: ${{ vars.CI_ALLOWED_ACTORS }}
          require_dispatch: 'true'
      - name: Enforce authorization
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "Only authorized users can run this workflow"
          exit 1

  build-reverseproxy-backup-release-image:
    name: ReverseProxy and Backup Docker Image build
    needs: [check-authorization]
    runs-on: ubuntu-latest
    if: ${{ needs.check-authorization.outputs.should_run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build & push release images
        uses: ./.github/actions/build-neo4j-images
        with:
          registry: docker.io
          registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          reverseproxy_tag: neo4j/helm-charts-reverse-proxy:${{ inputs.DOCKER_IMAGE_VERSION }}
          operations_tag: neo4j/helm-charts-operations:${{ inputs.DOCKER_IMAGE_VERSION }}
          backup_tag_debian: neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}
          backup_tag_redhat: neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}-ubi9
          backup_source_debian: neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise
          backup_source_redhat: neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise-ubi9
          cache_scope: release

  packaging:
    name: Packaging and Release
    needs: [check-authorization, build-reverseproxy-backup-release-image]
    runs-on: ubuntu-latest
    if: needs.check-authorization.outputs.should_run == 'true'
    env:
      HELM_CHART_VERSION: ${{ inputs.HELM_CHART_VERSION }}
      DOCKER_IMAGE_VERSION: ${{ inputs.DOCKER_IMAGE_VERSION }}
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:${{ vars.CI_IMAGE_TAG || 'latest' }}
      options: --user 1001
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}
          ref: dev

      - name: Version Updates
        run: |
          git config --global user.email team-smcs@neo4j.com
          git config --global user.name "team-smcs"
          ./bin/gcloud/version_updates

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p tmp
          python3 bin/changelog/generate.py \
            --chart-version "${HELM_CHART_VERSION}" \
            --docker-version "${DOCKER_IMAGE_VERSION}" \
            --out tmp/release-notes.md
          python3 bin/changelog/update_file.py \
            --notes tmp/release-notes.md \
            --changelog CHANGELOG.md \
            --chart-version "${HELM_CHART_VERSION}" \
            --docker-version "${DOCKER_IMAGE_VERSION}"
          git add CHANGELOG.md

      - name: GPG Key Signing
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_GPG }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_GPG }}
          export ROLE_ARN_GPG=${{ secrets.ROLE_ARN_GPG }}
          export SECRET_ID_GPG=${{ secrets.SECRET_ID_GPG }}          
          ./bin/gcloud/gpg_signing          

      - name: Upload Helm Charts
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_HELM }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_HELM }}
          export AWS_REGION="us-east-1"          
          export PACKAGE_SIGNING_KEY=${{ secrets.PACKAGE_SIGNING_KEY }}
          export PACKAGE_SIGNING_PASSPHRASE=${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          ./bin/gcloud/package_upload          

      - name: Update index.yaml
        run: |          
          ./bin/gcloud/index_yaml_update

      - name: Set Chart Version
        id: chart_version
        run: |
          echo "CHART_VERSION=${HELM_CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Using chart version ${HELM_CHART_VERSION} for release"

      - name: Release Notes
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ steps.chart_version.outputs.CHART_VERSION }}
          tag_name: ${{ steps.chart_version.outputs.CHART_VERSION }}
          token: ${{ secrets.GH_TOKEN }}
          body_path: tmp/release-notes.md
          make_latest: true
          files: |
            tmp/new-packages/*.tgz

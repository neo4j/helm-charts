name: Package and Release Only

on:
  workflow_dispatch:
    inputs:
      HELM_CHART_VERSION:
        description: 'Helm chart version to be released (e.g., 5.26.10)'
        type: string
        required: true
      DOCKER_IMAGE_VERSION:
        description: 'Docker image version/Neo4j version to use (e.g., 5.26.10)'
        type: string
        required: true

env:
  GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
  CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
  CLOUDSDK_COMPUTE_ZONE: "europe-west2-b"
  CLOUDSDK_COMPUTE_REGION: "europe-west2"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
  GCP_SERVICE_ACCOUNT_CRED: ${{ secrets.GCLOUD_SERVICE_KEY }}
  BLOOM_LICENSE: ${{ secrets.BLOOM_LICENSE }}
  IPS_USERNAME: ${{ secrets.IPS_USERNAME }}
  IPS_EMAIL: ${{ secrets.IPS_EMAIL }}
  RESOURCE_PREFIX: ghactions

permissions:
  contents: write

jobs:
  check-authorization:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - id: check
        run: |
          if [[ "${{ github.actor }}" == "bfeshti" || "${{ github.actor }}" == "riggi-alekaj" ]]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "Only authorized users can run this workflow"
            exit 1
          fi

  build-reverseproxy-backup-release-image:
    name: ReverseProxy and Backup Docker Image build
    needs: [check-authorization]
    runs-on: ubuntu-latest
    if: ${{ needs.check-authorization.outputs.should_run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 5.26

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push reverse proxy image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-reverse-proxy"
          push: true
          tags: "neo4j/helm-charts-reverse-proxy:${{ inputs.HELM_CHART_VERSION }}"
          provenance: false

      - name: Build and push operations image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j/neo4j-operations"
          push: true
          tags: "neo4j/helm-charts-operations:${{ inputs.HELM_CHART_VERSION }}"
          provenance: false

      - name: Build and push backup image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: true
          tags: "neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}"
          provenance: false
          build-args: |
            IMAGE=neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise
            DISTRIBUTION=debian

      - name: Build and push red hat backup image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: true
          tags: "neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}-ubi10"
          provenance: false
          build-args: |
            IMAGE=neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise-ubi10
            DISTRIBUTION=redhat

  packaging:
    name: Packaging and Release
    needs: [build-reverseproxy-backup-release-image]
    runs-on: ubuntu-latest
    if: ${{ needs.check-authorization.outputs.should_run == 'true' }}
    env:
      HELM_CHART_VERSION: ${{ inputs.HELM_CHART_VERSION }}
      DOCKER_IMAGE_VERSION: ${{ inputs.DOCKER_IMAGE_VERSION }}
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
    container:
      image: ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
      options: --user 1001
      credentials:
        username: _json_key
        password: ${{ secrets.GCLOUD_SERVICE_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: '0'
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}
          ref: 5.26

      - name: Version Updates
        run: |          
          git config --global user.email team-smcs@neo4j.com
          git config --global user.name "team-smcs"
          ./bin/gcloud/version_updates

      - name: GPG Key Signing
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_GPG }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_GPG }}
          export ROLE_ARN_GPG=${{ secrets.ROLE_ARN_GPG }}
          export SECRET_ID_GPG=${{ secrets.SECRET_ID_GPG }}          
          ./bin/gcloud/gpg_signing          

      - name: Upload Helm Charts
        run: |
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID_HELM }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY_HELM }}
          export AWS_REGION="us-east-1"          
          export PACKAGE_SIGNING_KEY=${{ secrets.PACKAGE_SIGNING_KEY }}
          export PACKAGE_SIGNING_PASSPHRASE=${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
          ./bin/gcloud/package_upload          

      - name: Update index.yaml
        run: |          
          ./bin/gcloud/index_yaml_update

      - name: Release Notes
        uses: softprops/action-gh-release@v1
        with:
          name: v${{ inputs.HELM_CHART_VERSION }}
          tag_name: ${{ inputs.HELM_CHART_VERSION }}
          token: ${{ secrets.GH_TOKEN }}
          body: "- Update to Neo4j ${{ inputs.DOCKER_IMAGE_VERSION}} as the new baseline, see [Release notes](https://neo4j.com/release-notes/database/neo4j-5///) for details of changes"
          make_latest: true
          files: |
            neo4j-${{ inputs.HELM_CHART_VERSION }}.tgz
            neo4j-admin-${{ inputs.HELM_CHART_VERSION }}.tgz
            neo4j-reverse-proxy-${{ inputs.HELM_CHART_VERSION }}.tgz
            neo4j-headless-service-${{ inputs.HELM_CHART_VERSION}}.tgz
            neo4j-persistent-volume-${{ inputs.HELM_CHART_VERSION }}.tgz
            neo4j-loadbalancer-${{ inputs.HELM_CHART_VERSION }}.tgz 
name: Package and Release Only

on:
  workflow_dispatch:
    inputs:
      HELM_CHART_VERSION:
        description: 'Helm chart version to be released (e.g., 5.26.26)'
        type: string
        required: true
      DOCKER_IMAGE_VERSION:
        description: 'Docker image version/Neo4j version to use (e.g., 5.26.26)'
        type: string
        required: true

env:
  CLOUDSDK_CORE_PROJECT: ${{ secrets.CLOUDSDK_CORE_PROJECT }}
  CLOUDSDK_COMPUTE_ZONE: "europe-west2-b"
  CLOUDSDK_COMPUTE_REGION: "europe-west2"
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AZURE_STORAGE_ACCOUNT_NAME: ${{ secrets.AZURE_STORAGE_ACCOUNT_NAME }}
  AZURE_STORAGE_ACCOUNT_KEY: ${{ secrets.AZURE_STORAGE_ACCOUNT_KEY }}
  GCP_SERVICE_ACCOUNT_CRED: ${{ secrets.GCLOUD_SERVICE_KEY }}
  BLOOM_LICENSE: ${{ secrets.BLOOM_LICENSE }}
  IPS_USERNAME: ${{ secrets.IPS_USERNAME }}
  IPS_EMAIL: ${{ secrets.IPS_EMAIL }}
  RESOURCE_PREFIX: ghactions

permissions:
  contents: read

jobs:
  check-authorization:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: gate
        uses: ./.github/actions/authz-gate
        with:
          allowed_actors: ${{ vars.CI_ALLOWED_ACTORS }}
          require_dispatch: 'true'
          require_branch: '5.26'
      - name: Enforce authorization
        if: steps.gate.outputs.should_run != 'true'
        run: |
          echo "Only authorized users can run this workflow"
          exit 1

  build-reverseproxy-backup-release-image:
    name: ReverseProxy and Backup Docker Image build
    needs: [check-authorization]
    runs-on: ubuntu-latest
    if: ${{ needs.check-authorization.outputs.should_run == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build & push release images
        uses: ./.github/actions/build-neo4j-images
        with:
          registry: docker.io
          registry_username: ${{ secrets.DOCKERHUB_USERNAME }}
          registry_password: ${{ secrets.DOCKERHUB_TOKEN }}
          reverseproxy_tag: neo4j/helm-charts-reverse-proxy:${{ inputs.DOCKER_IMAGE_VERSION }}
          operations_tag: neo4j/helm-charts-operations:${{ inputs.DOCKER_IMAGE_VERSION }}
          backup_tag_debian: neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}
          backup_tag_redhat: neo4j/helm-charts-backup:${{ inputs.HELM_CHART_VERSION }}-ubi10
          backup_source_debian: neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise-trixie
          backup_source_redhat: neo4j:${{ inputs.DOCKER_IMAGE_VERSION }}-enterprise-ubi10
          cache_scope: release

  packaging:
    name: Packaging and Release
    needs: [check-authorization, build-reverseproxy-backup-release-image]
    runs-on: ubuntu-latest
    if: needs.check-authorization.outputs.should_run == 'true'
    environment: helm-production
    concurrency:
      group: helm-production-release
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
      id-token: write
    env:
      HELM_CHART_VERSION: ${{ inputs.HELM_CHART_VERSION }}
      DOCKER_IMAGE_VERSION: ${{ inputs.DOCKER_IMAGE_VERSION }}
      HELM_REPO_NAME: ${{ vars.HELM_REPO_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: '0'
          fetch-tags: true
          token: ${{ secrets.GH_TOKEN }}
          ref: 5.26

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.21.4

      - name: Version Updates
        run: |
          git config --global user.email team-smcs@neo4j.com
          git config --global user.name "team-smcs"
          ./bin/gcloud/version_updates

      - name: Generate changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          mkdir -p tmp
          python3 bin/changelog/generate.py \
            --chart-version "${HELM_CHART_VERSION}" \
            --docker-version "${DOCKER_IMAGE_VERSION}" \
            --out tmp/release-notes.md
          python3 bin/changelog/update_file.py \
            --notes tmp/release-notes.md \
            --changelog CHANGELOG.md \
            --chart-version "${HELM_CHART_VERSION}" \
            --docker-version "${DOCKER_IMAGE_VERSION}"
          git add CHANGELOG.md

      - name: GPG Key Signing
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_GPG }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_GPG }}
          ROLE_ARN_GPG: ${{ secrets.ROLE_ARN_GPG }}
          SECRET_ID_GPG: ${{ secrets.SECRET_ID_GPG }}
        run: ./bin/gcloud/gpg_signing

      - name: Package and verify Helm charts
        env:
          PACKAGE_SIGNING_KEY: ${{ secrets.PACKAGE_SIGNING_KEY }}
          PACKAGE_SIGNING_PASSPHRASE: ${{ secrets.PACKAGE_SIGNING_PASSPHRASE }}
        run: ./bin/release/package_charts

      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_HELM_RELEASE_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Log in to Artifact Registry
        env:
          ACCESS_TOKEN: ${{ steps.gcp-auth.outputs.access_token }}
          GAR_HOST: ${{ vars.HELM_OCI_LOCATION }}-docker.pkg.dev
        run: |
          printf '%s\n' "${ACCESS_TOKEN}" |
            helm registry login "${GAR_HOST}" \
              --username oauth2accesstoken \
              --password-stdin

      - name: Publish and verify OCI charts
        env:
          HELM_OCI_REGISTRY: ${{ vars.HELM_OCI_LOCATION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.HELM_OCI_REPOSITORY }}
        run: ./bin/release/publish_oci

      - name: Publish classic Helm repository
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID_HELM }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY_HELM }}
          AWS_REGION: us-east-1
        run: ./bin/release/publish_classic

      - name: Update index.yaml
        run: ./bin/gcloud/index_yaml_update

      - name: Set Chart Version
        id: chart_version
        run: |
          echo "CHART_VERSION=${HELM_CHART_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Using chart version ${HELM_CHART_VERSION} for release"

      - name: Release Notes
        uses: softprops/action-gh-release@26994186c0ac3ef5cae75ac16aa32e8153525f77 # v1
        with:
          name: v${{ steps.chart_version.outputs.CHART_VERSION }}
          tag_name: ${{ steps.chart_version.outputs.CHART_VERSION }}
          token: ${{ secrets.GH_TOKEN }}
          body_path: tmp/release-notes.md
          make_latest: true
          files: |
            tmp/new-packages/*.tgz
            tmp/new-packages/*.tgz.prov
            tmp/oci-digests.txt

name: Auto-release on new Neo4j version

on:
  schedule:
    # Every 2 hours.
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Release branch to check'
        type: choice
        required: true
        default: both
        options:
          - both
          - dev
          - '5.26'

permissions:
  contents: read
  actions: write

env:
  # Silence the Node 20 deprecation warning on actions/checkout, setup-python,
  # etc. The runtime will flip the default to Node 24 in June 2026 anyway.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  auto-release:
    name: Auto-release ${{ matrix.target_branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_branch: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.target_branch != 'both' && format('["{0}"]', inputs.target_branch) || '["dev","5.26"]') }}
    env:
      TARGET_BRANCH: ${{ matrix.target_branch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.target_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Detect new Neo4j docker version
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          python bin/release/detect_new_version.py >> "$GITHUB_OUTPUT"

      - name: Dispatch tests.yml with RELEASE=true
        if: steps.detect.outputs.should_release == 'true'
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HELM_CHART_VERSION: ${{ steps.detect.outputs.helm_chart_version }}
          DOCKER_IMAGE_VERSION: ${{ steps.detect.outputs.docker_image_version }}
        run: |
          set -euo pipefail

          # ISO 8601 instant immediately before dispatch; used to identify the
          # run we just created via the --created filter on gh run list.
          before=$(date -u +%FT%TZ)

          gh workflow run tests.yml \
            --ref "${TARGET_BRANCH}" \
            -f HELM_CHART_VERSION="${HELM_CHART_VERSION}" \
            -f DOCKER_IMAGE_VERSION="${DOCKER_IMAGE_VERSION}" \
            -f RELEASE=true

          # Poll for the new run to appear (up to ~2 minutes).
          run_id=""
          for _ in $(seq 1 30); do
            sleep 5
            run_id=$(gh run list \
              --workflow=tests.yml \
              --event=workflow_dispatch \
              --branch="${TARGET_BRANCH}" \
              --created=">=${before}" \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId' || true)
            if [[ -n "${run_id}" && "${run_id}" != "null" ]]; then
              break
            fi
          done
          if [[ -z "${run_id}" || "${run_id}" == "null" ]]; then
            echo "::error::Failed to locate dispatched tests.yml run after 150s"
            exit 1
          fi
          url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${run_id}"
          echo "run_id=${run_id}" >> "$GITHUB_OUTPUT"
          echo "run_url=${url}" >> "$GITHUB_OUTPUT"
          echo "Dispatched run: ${url}"

      - name: Wait for tests.yml to finish
        if: steps.detect.outputs.should_release == 'true'
        id: watch
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run watch "${{ steps.dispatch.outputs.run_id }}" --exit-status
          conclusion=$(gh run view "${{ steps.dispatch.outputs.run_id }}" --json conclusion --jq .conclusion)
          echo "conclusion=${conclusion}" >> "$GITHUB_OUTPUT"

      - name: Build failure notification context
        if: failure()
        id: failure_context
        env:
          DETECT_OUTCOME: ${{ steps.detect.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch.outcome }}
          WATCH_OUTCOME: ${{ steps.watch.outcome }}
        run: |
          set -euo pipefail

          detector_result="${DETECT_OUTCOME:-skipped}"
          release_result="skipped"
          if [[ "${DISPATCH_OUTCOME:-}" == "failure" || "${WATCH_OUTCOME:-}" == "failure" ]]; then
            release_result="failure"
          elif [[ "${DISPATCH_OUTCOME:-}" == "cancelled" || "${WATCH_OUTCOME:-}" == "cancelled" ]]; then
            release_result="cancelled"
          elif [[ "${DISPATCH_OUTCOME:-}" == "success" && "${WATCH_OUTCOME:-}" == "success" ]]; then
            release_result="success"
          fi

          echo "detector_result=${detector_result}" >> "$GITHUB_OUTPUT"
          echo "release_result=${release_result}" >> "$GITHUB_OUTPUT"

      - uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_FAILURES }}
          payload: |
            {
              "text": ":x: helm-charts auto-release failed. Detector: ${{ steps.failure_context.outputs.detector_result }}; release run: ${{ steps.failure_context.outputs.release_result }}. Neo4j: ${{ steps.detect.outputs.docker_image_version || 'unknown' }}; chart: ${{ steps.detect.outputs.helm_chart_version || 'unknown' }}; reason: ${{ steps.detect.outputs.failure_reason || 'workflow_failure' }}; missing variants: ${{ steps.detect.outputs.missing_variants || 'n/a' }}. Dispatched run: ${{ steps.dispatch.outputs.run_url || 'not dispatched' }} | Orchestrator: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - uses: slackapi/slack-github-action@fcfb566f8b0aab22203f066d80ca1d7e4b5d05b3 # v1
        if: success() && steps.detect.outputs.should_release == 'true'
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        with:
          channel-id: ${{ vars.SLACK_CHANNEL_RELEASES }}
          payload: |
            {
              "text": ":white_check_mark: helm-charts auto-released ${{ steps.detect.outputs.helm_chart_version }} (Neo4j ${{ steps.detect.outputs.docker_image_version }}). Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.detect.outputs.helm_chart_version }}"
            }

name: Build Helm Charts Backup Image

on:
  workflow_dispatch:
    inputs:
      BASE_IMAGE_DEBIAN:
        description: 'Base image for Debian build (e.g. neo4j:enterprise-dev or neo4j:5.x.x-enterprise)'
        type: string
        default: 'neo4j:enterprise-dev'
      BASE_IMAGE_REDHAT:
        description: 'Base image for RedHat build (e.g. neo4j:enterprise-dev-ubi9 or neo4j:5.x.x-enterprise-ubi9)'
        type: string
        default: 'neo4j:enterprise-dev-ubi9'
      PUSH_TO_REGISTRY:
        description: 'Push images to registry'
        type: boolean
        default: true
      TAG_SUFFIX:
        description: 'Optional suffix to add to the image tag (e.g. -test)'
        type: string
        default: ''
      VERSION:
        description: 'Version tag for the image'
        type: string
        default: '5.26.3'

env:
  GCLOUD_SERVICE_KEY: ${{ secrets.GCLOUD_SERVICE_KEY }}
  RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build-backup-image:
    name: Build Helm Charts Backup Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        if: ${{ inputs.PUSH_TO_REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: europe-west2-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCLOUD_SERVICE_KEY }}

      - name: Build and push Helm Charts Backup image
        uses: docker/build-push-action@v5
        with:
          context: "{{defaultContext}}:neo4j-admin"
          push: ${{ inputs.PUSH_TO_REGISTRY }}
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/helm-charts-backup:${{ inputs.VERSION }}${{ inputs.TAG_SUFFIX }}
            ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/helm-charts-backup:${{ env.RUN_ID }}${{ inputs.TAG_SUFFIX }}
          provenance: false
          build-args: |
            IMAGE=${{ inputs.BASE_IMAGE_DEBIAN }}
            DISTRIBUTION=debian

      - name: Image Details
        run: |
          echo "✅ Build completed!"
          echo "📦 Image tags:"
          echo "   - ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/helm-charts-backup:${{ inputs.VERSION }}${{ inputs.TAG_SUFFIX }} (Primary version tag)"
          echo "   - ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/helm-charts-backup:${{ env.RUN_ID }}${{ inputs.TAG_SUFFIX }} (Run ID tag)"
          if [[ "${{ inputs.PUSH_TO_REGISTRY }}" == "true" ]]; then
            echo "🚀 Images have been pushed to the registry"
          else
            echo "ℹ️ Images were built locally only (not pushed to registry)"
          fi 
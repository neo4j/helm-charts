name: Build Docker File (Dev)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/buildDockerfile.yml
      - build/Dockerfile
    branches:
      - dev

jobs:
  build-docker-file:
    name: Build Docker file
    runs-on: ubuntu-latest
    steps:
      - name: Compute build metadata
        id: meta
        run: |
          ts="$(date -u +%Y%m%d-%H%M%S)"
          echo "tag=${ts}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Google Artifact Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: europe-west2-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCLOUD_SERVICE_KEY }}

      # Push a timestamp+sha tag alongside `latest` so maintainers can flip
      # the CI_IMAGE_TAG repo variable to a pinned reference whenever they
      # need reproducible test runs.
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: "{{defaultContext}}:build"
          push: true
          tags: |
            ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:latest
            ${{ vars.ARTIFACT_REGISTRY_REPO_NAME }}/githubactions:${{ steps.meta.outputs.tag }}
          provenance: false

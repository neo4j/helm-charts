name: Bug Report
description: File a bug report 
title: "[Bug]: "
labels: ["bug"]
assignees:
  - bfeshti
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Chart Name
      description: What chart are you running ?
      options:
        - Neo4j Cluster
        - Neo4j Standalone
        - Neo4j Read Replica
        - Neo4j Headless Service
        - Neo4j Cluster LoadBalancer
        - Neo4j
        - Neo4j Admin
        - Neo4j Reverse Proxy
        - Neo4j LoadBalancer 
    validations:
      required: true      
  - type: textarea
    id: version
    attributes:
      label: Chart Version
      description: What version of helm-charts are you running?
    validations:
      required: true
  - type: dropdown
    id: browsers
    attributes:
      label: Environment
      options:
        - Google Cloud Platform
        - Amazon Web Services
        - Microsoft Azure
        - Local Machine
        - My environment is not listed
        - Issue seen on all the cloud providers (GCP , AWS , AKS)
    validations:
      required: true        
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://example.com)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
